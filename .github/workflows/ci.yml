name: CI & Quantitative Test Matrix

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run Deterministic Unit Tests & Vectorized Benchmark
      env:
        SKIP_SEC_ONLINE_TESTS: "1"
      run: |
        python -m unittest discover tests -v
        python tests/test_forensic_engine.py

    - name: Run Pytest Suite with Coverage
      env:
        SKIP_SEC_ONLINE_TESTS: "1"
      run: |
        pytest tests/ -m "not integration" -v --cov=forensic_engine --cov=pipelines
